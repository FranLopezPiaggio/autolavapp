services:
  db:
    image: postgres:16-alpine
    container_name: autolavapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autolavapp-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d autolavapp-db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autolavapp-api
    command: pnpm --filter api dev
    environment:
      DATABASE_URL: postgresql://postgres:A4t3l0v0pp#!@db.evhirtwrfsgdyzvckipj.supabase.co:5432/postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload: mount only src/ so pnpm symlinked node_modules stay intact
      - ./apps/api/src:/app/apps/api/src:delegated
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autolavapp-web
    command: pnpm --filter web dev -- --host
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src:delegated
    depends_on:
      - api

volumes:
  postgres_data:
